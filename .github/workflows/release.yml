name: Build Release

# 只允许手动触发：在 GitHub 仓库页面 Actions -> Build Release -> Run workflow
# 填写版本号后点击运行，构建完成会自动创建 Release 并上传 zip 压缩包。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 / Release tag（例如 v1.0.0）"
        required: true
        type: string
      prerelease:
        description: "标记为 Pre-release（预发布）"
        required: true
        type: boolean
        default: false
      draft:
        description: "先保存为草稿，需要再手动点一次发布"
        required: true
        type: boolean
        default: false

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build-and-release:
    name: 构建并发布
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 校验版本号
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:VERSION)) { throw "版本号不能为空" }
          if ($env:VERSION -notmatch '^[A-Za-z0-9._-]+$') {
            throw "版本号只能包含字母、数字、点、下划线和连字符（当前：$env:VERSION）"
          }
          Write-Host "版本号: $env:VERSION"

      - name: 构建 exe
        shell: pwsh
        env:
          # 覆盖脚本内的国内镜像，使用官方源 + 校验
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./build.ps1

      - name: 打包 zip
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Get-ChildItem -LiteralPath . -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) { throw "未找到构建产物 exe" }
          Write-Host "构建产物: $($exe.Name)  ($($exe.Length) 字节)"

          $dist = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          $usage = @"
          Dust Front RTS Demo 汉化补丁 $env:VERSION

          【安装】
          1. 解压本压缩包。
          2. 将 “$($exe.Name)” 复制到游戏目录内。
             游戏目录位置：Steam 库 -> 右键 “Dust Front RTS Demo” -> 管理 -> 浏览本地文件。
          3. 在游戏目录内双击运行该 exe，点击“安装汉化补丁”。

          【还原】
          再次运行该 exe，点击“还原游戏文件”即可恢复原版。

          【注意】
          - 安装前请先关闭游戏。
          - 原始文件会自动备份到 %LocalAppData%\DustFrontRTS_Chinese。
          - 在程序右下角点击“删除缓存”会一并删除该备份，删除后无法还原。

          https://github.com/${{ github.repository }}
          "@

          $usagePath = Join-Path $dist "使用说明.txt"
          # 显式写入带 BOM 的 UTF-8，兼容 PowerShell 5.1 / 7 与旧版记事本
          [System.IO.File]::WriteAllText($usagePath, $usage, [System.Text.UTF8Encoding]::new($true))

          $zipName = "Dust-Front-RTS-Demo-Chinese-Localization-$env:VERSION.zip"
          $zipPath = Join-Path $dist $zipName
          Compress-Archive -LiteralPath $exe.FullName, $usagePath -DestinationPath $zipPath -Force

          Write-Host "已生成: $zipPath"
          Get-ChildItem -LiteralPath $dist | Format-Table Name, Length -AutoSize

      - name: 上传构建产物（便于排查问题）
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: 创建 Release 并上传 zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: dist/*.zip
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
